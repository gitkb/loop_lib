name: Auto Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-format-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  format:
    name: Auto Format
    runs-on: ubuntu-latest
    # Skip if:
    # - PR from fork (can't push back)
    # - Commit by github-actions[bot] (prevent infinite loop)
    if: |
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          path: loop_lib
          # Use PAT to trigger downstream workflows; fallback to GITHUB_TOKEN
          token: ${{ secrets.PARENT_REPO_PAT || github.token }}

      - name: Clone dependencies
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for repo in meta_core; do
            url="https://github.com/gitkb/${repo}.git"
            # Exit code 2 means the branch does not exist; anything else is an error
            status=0
            git ls-remote --exit-code --heads "$url" "refs/heads/$BRANCH" > /dev/null || status=$?
            if [ "$status" -eq 0 ]; then
              git clone --depth 1 -b "$BRANCH" "$url"
            elif [ "$status" -eq 2 ]; then
              echo "Branch ${BRANCH} not found for ${repo}; using the default branch"
              git clone --depth 1 "$url"
            else
              echo "::error::Failed to look up ${repo}"
              exit 1
            fi
          done

      - name: Create workspace Cargo.toml
        run: |
          cat > Cargo.toml << 'EOF'
          [workspace]
          members = ["loop_lib", "meta_core"]
          resolver = "2"

          [workspace.package]
          version = "0.1.0"
          edition = "2021"
          license = "MIT"
          repository = "https://github.com/gitkb/meta"
          EOF

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run cargo fmt
        working-directory: loop_lib
        run: cargo fmt --all

      - name: Check for changes
        id: changes
        working-directory: loop_lib
        run: |
          if git diff --quiet; then
            echo "formatted=false" >> $GITHUB_OUTPUT
          else
            echo "formatted=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.formatted == 'true'
        working-directory: loop_lib
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-format code"
          git push
