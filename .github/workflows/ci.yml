name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: loop_lib

      - name: Clone dependencies
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for repo in meta_core; do
            url="https://github.com/gitkb/${repo}.git"
            # Exit code 2 means the branch does not exist; anything else is an error
            status=0
            git ls-remote --exit-code --heads "$url" "$BRANCH" > /dev/null || status=$?
            if [ "$status" -eq 0 ]; then
              git clone --depth 1 -b "$BRANCH" "$url"
            elif [ "$status" -eq 2 ]; then
              echo "Branch ${BRANCH} not found for ${repo}; using the default branch"
              git clone --depth 1 "$url"
            else
              echo "::error::Failed to look up ${repo}"
              exit 1
            fi
          done

      - name: Create workspace Cargo.toml
        shell: bash
        run: |
          cat > Cargo.toml << 'EOF'
          [workspace]
          members = ["loop_lib", "meta_core"]
          resolver = "2"

          [workspace.package]
          version = "0.1.0"
          edition = "2021"
          license = "MIT"
          repository = "https://github.com/gitkb/meta"
          EOF

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loop_lib

      - name: Run tests
        working-directory: loop_lib
        run: cargo test --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: loop_lib

      - name: Clone dependencies
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for repo in meta_core; do
            url="https://github.com/gitkb/${repo}.git"
            # Exit code 2 means the branch does not exist; anything else is an error
            status=0
            git ls-remote --exit-code --heads "$url" "$BRANCH" > /dev/null || status=$?
            if [ "$status" -eq 0 ]; then
              git clone --depth 1 -b "$BRANCH" "$url"
            elif [ "$status" -eq 2 ]; then
              echo "Branch ${BRANCH} not found for ${repo}; using the default branch"
              git clone --depth 1 "$url"
            else
              echo "::error::Failed to look up ${repo}"
              exit 1
            fi
          done

      - name: Create workspace Cargo.toml
        run: |
          cat > Cargo.toml << 'EOF'
          [workspace]
          members = ["loop_lib", "meta_core"]
          resolver = "2"

          [workspace.package]
          version = "0.1.0"
          edition = "2021"
          license = "MIT"
          repository = "https://github.com/gitkb/meta"
          EOF

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: loop_lib

      - name: Run clippy
        working-directory: loop_lib
        run: cargo clippy --all-targets --all-features -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: loop_lib

      - name: Clone dependencies
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for repo in meta_core; do
            url="https://github.com/gitkb/${repo}.git"
            # Exit code 2 means the branch does not exist; anything else is an error
            status=0
            git ls-remote --exit-code --heads "$url" "$BRANCH" > /dev/null || status=$?
            if [ "$status" -eq 0 ]; then
              git clone --depth 1 -b "$BRANCH" "$url"
            elif [ "$status" -eq 2 ]; then
              echo "Branch ${BRANCH} not found for ${repo}; using the default branch"
              git clone --depth 1 "$url"
            else
              echo "::error::Failed to look up ${repo}"
              exit 1
            fi
          done

      - name: Create workspace Cargo.toml
        run: |
          cat > Cargo.toml << 'EOF'
          [workspace]
          members = ["loop_lib", "meta_core"]
          resolver = "2"

          [workspace.package]
          version = "0.1.0"
          edition = "2021"
          license = "MIT"
          repository = "https://github.com/gitkb/meta"
          EOF

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: loop_lib
        run: cargo fmt --all -- --check
